apply plugin: 'maven-publish'
apply plugin: 'signing'

ext {
    PUBLISH_GROUP_ID = 'com.navchetna.aegis'
    PUBLISH_ARTIFACT_ID = 'aegis-auth-android'
    PUBLISH_VERSION = '1.0.0'
}

android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId PUBLISH_GROUP_ID
            artifactId PUBLISH_ARTIFACT_ID
            version PUBLISH_VERSION

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'Aegis Auth Android SDK'
                description = 'Aegis Auth is a unified identity management system providing secure Android authentication.'
                url = 'https://github.com/navchetnaofficialllp/aegis-auth-sdk-android'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'navchetna'
                        name = 'Navchetna Technologies'
                        email = 'hello@navchetna.tech'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/navchetnaofficialllp/aegis-auth-sdk-android.git'
                    developerConnection = 'scm:git:ssh://github.com/navchetnaofficialllp/aegis-auth-sdk-android.git'
                    url = 'https://github.com/navchetnaofficialllp/aegis-auth-sdk-android'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "sonatype"
            url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            credentials {
                username ossrhUsername
                password ossrhPassword
            }
        }
    }
}

signing {
    sign publishing.publications
}